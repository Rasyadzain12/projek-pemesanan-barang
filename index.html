<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan Barang</title>
</head>
<body>

<center>
    
    <table border="1" cellpadding="15" cellspacing="0" width="700">
        <tr>
            <td>
                
                <table width="100%" border="0" cellpadding="5" cellspacing="0">
                    <tr>
                        <td align="center">
                            <b><a href="index.html">Home</a></b> &nbsp;|&nbsp;
                            <a href="hasil.html">Generate Link</a> &nbsp;|&nbsp;
                            <a href="#">Transaction History</a> &nbsp;|&nbsp;
                            <a href="#">Policy</a> &nbsp;|&nbsp;
                            <a href="#">Logout</a>
                        </td>
                    </tr>
                </table>

                <hr>

                <!-- Form Pemesanan -->
                <form id="formPemesanan" action="hasil.html" method="get">
                    <table width="100%" border="0" cellpadding="6" cellspacing="0">
                        <tr>
                            <!-- Kolom Kiri: Foto Pratinjau -->
                            <td width="150" valign="top" align="center">
                                <table border="1" cellpadding="10" cellspacing="0" width="130">
                                    <tr>
                                        <td align="center" height="120">
                                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                                <polyline points="21 15 16 10 5 21"/>
                                            </svg>
                                            <br>
                                            <small>Pratinjau Foto</small>
                                        </td>
                                    </tr>
                                </table>
                                <br>
                                <input type="file" id="foto" name="foto" accept="image/*">
                            </td>

                            <!-- Kolom Kanan: Input Form -->
                            <td valign="top">
                                <table width="100%" border="0" cellpadding="5" cellspacing="0">
                                    <tr>
                                        <td align="right" width="140"><label for="judul"><b>Title Here :</b></label></td>
                                        <td><input type="text" id="judul" name="judul" size="35" placeholder="Contoh: MacBook Air £800" required></td>
                                    </tr>

                                    <tr>
                                        <td align="right" valign="top"><label for="deskripsi"><b>Description :</b></label></td>
                                        <td><textarea id="deskripsi" name="deskripsi" rows="4" cols="33" placeholder="Year : 2009&#10;Model :&#10;Price : £800" required></textarea></td>
                                    </tr>

                                    <tr>
                                        <td align="right"><label for="rekening"><b>Account Number :</b></label></td>
                                        <td><input type="text" id="rekening" name="rekening" size="35" placeholder="Masukkan nomor rekening" required></td>
                                    </tr>

                                    <tr>
                                        <td align="right"><label for="bank"><b>Bank :</b></label></td>
                                        <td>
                                            <select id="bank" name="bank" required>
                                                <option value="" selected disabled>Pilih bank</option>
                                                <option value="Visa Debit">Visa Debit</option>
                                                <option value="MasterCard">MasterCard</option>
                                                <option value="HSBC">HSBC</option>
                                                <option value="BCA">BCA</option>
                                                <option value="BRI">BRI</option>
                                                <option value="BNI">BNI</option>
                                                <option value="Mandiri">Mandiri</option>
                                            </select>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td align="right"><label for="pemilik"><b>Account Holder :</b></label></td>
                                        <td><input type="text" id="pemilik" name="pemilik" size="35" placeholder="Masukkan nama pemilik rekening" required></td>
                                    </tr>

                                    <tr>
                                        <td align="right"><label for="transaksi"><b>Transaction :</b></label></td>
                                        <td><input type="number" id="transaksi" name="transaksi" min="1" max="3" placeholder="Masukkan 1-3" required></td>
                                    </tr>

                                    <tr>
                                        <td></td>
                                        <td><small><i>* If the transaction is for 3 persons, choose 3 from the drop-down list.</i></small></td>
                                    </tr>

                                    <tr>
                                        <td></td>
                                        <td>
                                            <label><input type="checkbox" id="sms" name="sms" value="1"> Send to Mobile Phone</label><br>
                                            <label><input type="checkbox" id="emailCheck" name="emailCheck" value="1"> Send to Email</label>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td align="right"><label for="telepon"><b>Send to Mobile :</b></label></td>
                                        <td><input type="text" id="telepon" name="telepon" size="35" placeholder="Contoh: 1234567890"></td>
                                    </tr>

                                    <tr>
                                        <td align="right"><label for="email"><b>Send to Email :</b></label></td>
                                        <td><input type="email" id="email" name="email" size="35" placeholder="Contoh: nama@email.com"></td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>

                    <br>
                    <div align="center">
                        <input type="submit" value="Generate New Link">
                    </div>
                </form>
            </td>
        </tr>
    </table>
</center>

</body>
</html>
